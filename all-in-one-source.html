<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f0f0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>مطحنة الذهب — مؤقت الطحن</title>

<!-- ==========================================
     إعدادات التطبيق (Manifest) مدمجة هنا ليعمل بدون إنترنت
     ========================================== -->
<link rel="manifest" href='data:application/manifest+json,{"name":"مؤقت طحن الحجر","short_name":"مطحنة الذهب","start_url":"./index.html","display":"standalone","background_color":"%230f0f0f","theme_color":"%230f0f0f","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f0f0f%22/><text y=%2275%22 x=%2250%22 text-anchor=%22middle%22 font-size=%2260%22>⛏️</text></svg>","sizes":"192x192 512x512","type":"image/svg+xml"}]}'>

<!-- ==========================================
     قسم التصميم (CSS)
     هنا تتحكم في الألوان، الخطوط، وأحجام الأزرار
     ========================================== -->
<style>
  /* المتغيرات: إذا أردت تغيير ألوان التطبيق، غير الأكواد هنا فقط! */
  :root{
    --bg:#0f0f0f;         /* لون خلفية التطبيق */
    --card:#1b1b1b;       /* لون الصناديق */
    --card2:#242424;      /* لون الأزرار الثانوية */
    --text:#f5f5f5;       /* لون النص */
    --gold:#f5b301;       /* لون الذهبي (الحجر القاسي) */
    --gray:#8a8f98;       /* لون الرمادي (الحجر الطري) */
    --danger:#e5484d;     /* لون زر الإيقاف */
    --ok:#30a46c;         /* لون الحفظ */
    --blue:#3b82f6;       /* لون التكرار */
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; gap:14px; padding:16px; user-select:none;
  }
  h1{font-size:1.05rem; font-weight:500; opacity:.7; letter-spacing:.5px; margin-top:8px;}
  
  /* الدائرة والمؤقت */
  .ring-wrap{position:relative; width:min(72vw,300px); aspect-ratio:1;}
  svg{transform:rotate(-90deg); width:100%; height:100%;}
  circle{fill:none; stroke-width:12; stroke-linecap:round;}
  .track{stroke:#2a2a2a;}
  .prog{stroke:var(--gold); transition:stroke-dashoffset .9s linear, stroke .3s;}
  .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  #time{font-size:clamp(2.6rem,13vw,5rem); font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:1px; line-height:1;}
  #label{font-size:.85rem; opacity:.6; margin-top:6px;}

  /* الأزرار */
  .buttons{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:min(92vw,420px);}
  button{
    border:none; border-radius:16px; padding:20px 10px;
    font-size:1.1rem; font-weight:700; color:#0f0f0f;
    cursor:pointer; min-height:90px; transition:transform .08s; font-family:inherit;
  }
  button:active{transform:scale(.97);}
  .hard{background:var(--gold);}
  .soft{background:var(--gray); color:#fff;}
  .stop{grid-column:1/-1; background:var(--danger); color:#fff; min-height:56px; font-size:1rem; display:none;}
  .stop.show{display:block;}
  .repeat{grid-column:1/-1; background:var(--blue); color:#fff; min-height:56px; font-size:1rem; display:none;}
  .repeat.show{display:block;}
  .actions{display:flex; gap:10px; width:min(92vw,420px); flex-wrap:wrap;}
  .actions button{flex:1; min-width:calc(50% - 5px); min-height:48px; font-size:.85rem; border-radius:12px; background:var(--card2); color:var(--text);}
  
  .log{width:min(92vw,420px); font-size:.8rem; opacity:.6; text-align:center; min-height:1.2em;}
  .blink{animation:blink .7s infinite;}
  @keyframes blink{50%{opacity:.25;}}

  /* النوافذ المنبثقة والسجل */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.75); display:none; align-items:center; justify-content:center; padding:20px; z-index:100;}
  .modal.show{display:flex;}
  .modal-card{background:var(--card); border-radius:20px; padding:24px; width:min(100%,380px); display:flex; flex-direction:column; gap:16px;}
  .modal-card h2{font-size:1.1rem; text-align:center; font-weight:700;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:.85rem; opacity:.7;}
  .field input{background:var(--card2); border:1px solid #333; color:var(--text); border-radius:10px; padding:14px; font-size:1.2rem; text-align:center; font-family:inherit;}
  .field input:focus{outline:2px solid var(--gold);}
  .modal-actions{display:flex; gap:10px;}
  .modal-actions button{flex:1; min-height:48px; border-radius:12px; font-size:.95rem;}
  .btn-save{background:var(--ok); color:#fff;}
  .btn-cancel{background:var(--card2); color:var(--text);}

  .history{width:min(92vw,420px); background:var(--card); border-radius:16px; padding:14px; max-height:220px; overflow-y:auto; display:none;}
  .history.show{display:block;}
  .history h3{font-size:.9rem; margin-bottom:10px; opacity:.7; display:flex; justify-content:space-between;}
  .history h3 span{color:var(--danger); cursor:pointer; font-size:.8rem;}
  .history-item{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #2a2a2a; font-size:.85rem;}
  .history-item .meta{opacity:.55; font-size:.75rem;}

  .notif-banner{width:min(92vw,420px); background:var(--card2); border-radius:12px; padding:10px 14px; font-size:.8rem; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .notif-banner button{background:var(--ok); color:#fff; border-radius:8px; min-height:36px; padding:6px 14px; font-size:.8rem; min-width:auto;}
  .notif-banner.hidden{display:none;}
</style>
</head>
<body>

<h1>⛏️ مؤقت طحن الحجر</h1>

<div class="notif-banner" id="notifBanner">
  <span>🔔 فعّل الإشعارات ليصلك تنبيه حتى لو الشاشة مقفلة</span>
  <button onclick="requestNotif()">تفعيل</button>
</div>

<div class="ring-wrap">
  <svg viewBox="0 0 200 200">
    <circle class="track" cx="100" cy="100" r="88"/>
    <circle class="prog" id="prog" cx="100" cy="100" r="88" stroke-dasharray="552.9" stroke-dashoffset="0"/>
  </svg>
  <div class="center">
    <div id="time">00:00</div>
    <div id="label">اختر نوع الحجر</div>
  </div>
</div>

<div class="buttons">
  <button class="hard" id="btnHard" onclick="startHard()">🪨 قاسي<br><small id="hardDur">60 دقيقة</small></button>
  <button class="soft" id="btnSoft" onclick="startSoft()">🪨 طري<br><small id="softDur">30 دقيقة</small></button>
  <button class="repeat" id="repeatBtn" onclick="repeatLast()">🔁 تكرار الدورة الأخيرة</button>
  <button class="stop" id="stopBtn" onclick="stopTimer()">⏹️ إيقاف</button>
</div>

<div class="actions">
  <button onclick="openSettings()">⚙️ تعديل المدد</button>
  <button onclick="toggleHistory()">📜 السجل</button>
</div>

<div class="log" id="log"></div>

<div class="history" id="historyBox">
  <h3>سجل الدورات <span onclick="clearHistory()">مسح الكل</span></h3>
  <div id="historyList"></div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-card">
    <h2>⚙️ تعديل مدد الطحن</h2>
    <div class="field">
      <label>مدة الحجر القاسي (دقيقة)</label>
      <input type="number" id="inputHard" min="1" max="600" inputmode="numeric">
    </div>
    <div class="field">
      <label>مدة الحجر الطري (دقيقة)</label>
      <input type="number" id="inputSoft" min="1" max="600" inputmode="numeric">
    </div>
    <div class="modal-actions">
      <button class="btn-save" onclick="saveSettings()">💾 حفظ</button>
      <button class="btn-cancel" onclick="closeSettings()">إلغاء</button>
    </div>
  </div>
</div>

<!-- ==========================================
     قسم البرمجة (JavaScript)
     هنا يحدث السحر (الوقت، الصوت، الحفظ)
     ========================================== -->
<script>
// 1. المتغيرات الأساسية
const CIRC = 2 * Math.PI * 88;
const prog = document.getElementById('prog');
const timeEl = document.getElementById('time');
const labelEl = document.getElementById('label');
const stopBtn = document.getElementById('stopBtn');
const repeatBtn = document.getElementById('repeatBtn');
const logEl = document.getElementById('log');
const historyBox = document.getElementById('historyBox');
const historyList = document.getElementById('historyList');
const notifBanner = document.getElementById('notifBanner');

let endTime = null, totalMs = 0, ticker = null, currentType = '', currentCls = '';
let lastSession = JSON.parse(localStorage.getItem('millLast') || 'null');

// 2. إعدادات المدد (إذا أردت تغيير المدد الافتراضية من الكود، غير الأرقام هنا)
let settings = JSON.parse(localStorage.getItem('millSettings') || 'null') || { hard: 60, soft: 30 };

function applySettingsUI(){
  document.getElementById('hardDur').textContent = settings.hard + ' دقيقة';
  document.getElementById('softDur').textContent = settings.soft + ' دقيقة';
}
applySettingsUI();

function openSettings(){
  document.getElementById('inputHard').value = settings.hard;
  document.getElementById('inputSoft').value = settings.soft;
  document.getElementById('settingsModal').classList.add('show');
}
function closeSettings(){ document.getElementById('settingsModal').classList.remove('show'); }
function saveSettings(){
  const h = parseInt(document.getElementById('inputHard').value, 10);
  const s = parseInt(document.getElementById('inputSoft').value, 10);
  if (!h || h < 1 || h > 600 || !s || s < 1 || s > 600) { alert('أدخل قيمة بين 1 و 600 دقيقة'); return; }
  settings = { hard: h, soft: s };
  localStorage.setItem('millSettings', JSON.stringify(settings));
  applySettingsUI(); closeSettings(); renderLog('✅ تم حفظ المدد الجديدة');
}

// 3. الإشعارات
function updateNotifBanner(){
  if (!('Notification' in window)) { notifBanner.classList.add('hidden'); return; }
  if (Notification.permission === 'granted') notifBanner.classList.add('hidden');
  else notifBanner.classList.remove('hidden');
}
updateNotifBanner();

async function requestNotif(){
  if (!('Notification' in window)) { alert('متصفحك لا يدعم الإشعارات'); return; }
  const p = await Notification.requestPermission();
  updateNotifBanner();
  if (p === 'granted') renderLog('🔔 تم تفعيل الإشعارات');
  else renderLog('⚠️ الإشعارات مرفوضة');
}

function showNotification(title, body){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const n = new Notification(title, {
      body: body,
      icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">⛏️</text></svg>',
      tag: 'mill-done',
      requireInteraction: true
    });
    n.onclick = () => { window.focus(); n.close(); };
  } catch(e) {}
}

// 4. استرجاع الحالة
const saved = JSON.parse(localStorage.getItem('millState') || 'null');
if (saved && saved.endTime > Date.now()) {
  endTime = saved.endTime; totalMs = saved.totalMs; currentType = saved.type; currentCls = saved.cls || 'hard';
  labelEl.textContent = currentType; prog.style.stroke = currentCls === 'hard' ? 'var(--gold)' : 'var(--gray)';
  stopBtn.classList.add('show'); runTicker();
} else if (saved) { localStorage.removeItem('millState'); }

// 5. بدء وإيقاف المؤقت
function startHard(){ start(settings.hard, 'حجر قاسي', 'hard'); }
function startSoft(){ start(settings.soft, 'حجر طري', 'soft'); }

function start(minutes, type, cls) {
  stopTimer(true);
  totalMs = minutes * 60 * 1000;
  endTime = Date.now() + totalMs;
  currentType = type; currentCls = cls;
  labelEl.textContent = type;
  prog.style.stroke = cls === 'hard' ? 'var(--gold)' : 'var(--gray)';
  stopBtn.classList.add('show');
  repeatBtn.classList.remove('show');
  localStorage.setItem('millState', JSON.stringify({endTime, totalMs, type, cls}));
  localStorage.setItem('millLast', JSON.stringify({type, cls, minutes}));
  lastSession = {type, cls, minutes};
  runTicker();
}

function repeatLast(){ if (lastSession) start(lastSession.minutes, lastSession.type, lastSession.cls); }

function runTicker(){ clearInterval(ticker); tick(); ticker = setInterval(tick, 1000); }

function tick() {
  const left = endTime - Date.now();
  if (left <= 0) { finish(); return; }
  const s = Math.ceil(left / 1000);
  const m = Math.floor(s / 60), sec = s % 60;
  timeEl.textContent = `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  prog.style.strokeDashoffset = CIRC * (1 - left / totalMs);
}

function finish() {
  clearInterval(ticker);
  timeEl.textContent = '00:00';
  prog.style.strokeDashoffset = CIRC;
  timeEl.classList.add('blink');
  notify();
  showNotification('✅ انتهى الطحن', `${currentType} — جاهز للتفريغ`);
  addHistory(currentType, totalMs);
  localStorage.removeItem('millState');
  stopBtn.classList.remove('show');
  repeatBtn.classList.add('show');
  renderLog(`✅ انتهى طحن: ${currentType} — يمكنك التكرار`);
}

function stopTimer(silent = false) {
  clearInterval(ticker);
  endTime = null;
  timeEl.classList.remove('blink');
  timeEl.textContent = '00:00';
  prog.style.strokeDashoffset = 0;
  labelEl.textContent = 'اختر نوع الحجر';
  stopBtn.classList.remove('show');
  localStorage.removeItem('millState');
  if (!silent) { repeatBtn.classList.remove('show'); renderLog('⏹️ تم الإيقاف'); }
}

// 6. الصوت والاهتزاز (إذا أردت تغيير حدة الصوت، غير الرقم 880)
function notify() {
  if (navigator.vibrate) navigator.vibrate([500,200,500,200,500,200,500]);
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    [0, 0.4, 0.8, 1.2].forEach(t => beep(ctx, now + t));
    setTimeout(() => { try{ [0,0.4,0.8].forEach(t => beep(ctx, ctx.currentTime + 2 + t)); }catch(e){} }, 3000);
  } catch(e) {}
}
function beep(ctx, t) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.value = 880; 
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.6, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + 0.4);
}

// 7. السجل
function getHistory(){ return JSON.parse(localStorage.getItem('millHistory') || '[]'); }
function addHistory(type, ms){
  const h = getHistory();
  h.unshift({ type, minutes: Math.round(ms/60000), at: Date.now() });
  localStorage.setItem('millHistory', JSON.stringify(h.slice(0, 50)));
  if (historyBox.classList.contains('show')) renderHistory();
}
function renderHistory(){
  const h = getHistory();
  if (h.length === 0){ historyList.innerHTML = '<div style="opacity:.5;text-align:center;padding:10px;font-size:.85rem;">لا توجد دورات بعد</div>'; return; }
  historyList.innerHTML = h.map(it => {
    const isHard = it.type.includes('قاسي');
    const color = isHard ? 'var(--gold)' : 'var(--gray)';
    const d = new Date(it.at);
    const date = d.toLocaleDateString('ar-EG', {day:'2-digit', month:'2-digit'});
    const time = d.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
    return `<div class="history-item"><span style="color:${color};font-weight:700">${it.type}</span><span class="meta">${it.minutes} د • ${date} ${time}</span></div>`;
  }).join('');
}
function toggleHistory(){
  historyBox.classList.toggle('show');
  if (historyBox.classList.contains('show')) renderHistory();
}
function clearHistory(){
  if (confirm('مسح كل السجل؟')) { localStorage.removeItem('millHistory'); renderHistory(); }
}

function renderLog(txt){ logEl.textContent = txt; }

// 8. تفعيل الصوت عند أول لمسة
document.body.addEventListener('click', () => {
  if (!window._audioUnlocked) {
    try { new (window.AudioContext || window.webkitAudioContext)().resume(); } catch(e){}
    window._audioUnlocked = true;
  }
}, { once: true });

document.addEventListener('visibilitychange', () => { if (!document.hidden && endTime) tick(); });

// 9. العمل بدون إنترنت (Service Worker مدمج في الكود)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // إنشاء ملف الـ Service Worker برمجياً داخل المتصفح
    const swCode = `
      const CACHE_NAME = 'mill-v1';
      self.addEventListener('install', (e) => {
        e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['./', './index.html'])));
        self.skipWaiting();
      });
      self.addEventListener('fetch', (e) => {
        e.respondWith(caches.match(e.request).then(cached => cached || fetch(e.request)));
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    const swUrl = URL.createObjectURL(blob);
    
    navigator.serviceWorker.register(swUrl)
      .then(reg => console.log('تم تفعيل وضع الأوفلاين بنجاح'))
      .catch(err => console.log('خطأ في تفعيل الأوفلاين:', err));
  });
}
</script>
</body>
</html>
